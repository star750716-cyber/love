                    const avg = sum / dimQs.length;
                    const normalized = ((avg - 1) / 3) * 100;
                    scores[dim] = Math.round(normalized);
                    totalScore += normalized;

                                </div>

                                {/* 右側：雷達圖 */}
                                <div className="md:col-span-2 bg-cardBg rounded-[2rem] shadow-sm p-8 border border-borderSoft flex flex-col justify-center">
                                    <div className="mb-4 text-center md:text-left">
                                        <h2 className="font-serif text-lg font-bold text-textMain">六大面向分析</h2>
                                    </div>
                                    <RadarChart data={results} partnerData={partnerResults} />
                                </div>
                            </div>

                            {/* --- 全新配對碼 UI 區塊 (仿截圖 2) --- */}
                            {!partnerResults ? (
                                <div className="bg-cardBg rounded-[2rem] shadow-sm border border-borderSoft p-8 md:p-10 relative mt-10">
                                    {/* 頂部愛心 Icon */}
                                    <div className="absolute -top-6 left-1/2 -translate-x-1/2 w-12 h-12 rounded-full bg-[#FCF3F1] flex items-center justify-center text-primary text-xl border border-white">
                                        <i className="fa-solid fa-heart"></i>
                                    </div>
                                    
                                    <h2 className="text-2xl font-bold text-textMain text-center mt-4 mb-2">你的部分完成了</h2>
                                    <p className="text-textMuted text-sm text-center mb-8">把邀請連結傳給伴侶。對方用自己的手機完成後，就會直接看到兩人的結果。</p>
                                    
                                    {/* 虛線配對碼框 */}
                                    <div className="border border-dashed border-borderDashed rounded-2xl p-6 md:p-8 bg-[#FCF8F7] relative mb-6">
                                        <div className="text-center text-textMuted text-xs font-bold mb-3">你的配對碼</div>
                                        <div className="text-center text-3xl md:text-[2.5rem] font-bold text-[#6D4C53] tracking-[0.2em] mb-6 font-mono leading-none">
                                            {myCode}
                                        </div>
                                        <div className="flex flex-col sm:flex-row justify-center gap-4">
                                            <button 
                                                onClick={() => copyText(window.location.origin + window.location.pathname + "?code=" + myCode, 'link')}
                                                className="bg-gradient-to-r from-primary to-secondary text-white rounded-full px-8 py-3 text-sm font-bold shadow-md hover:shadow-lg transition flex items-center justify-center gap-2"
                                            >
                                                <i className="fa-regular fa-copy"></i> {copyStatusLink}
                                            </button>
                                            <button 
                                                onClick={() => copyText(myCode, 'code')}
                                                className="bg-white text-[#6D4C53] border border-borderDashed rounded-full px-8 py-3 text-sm font-bold hover:bg-primaryLight transition flex items-center justify-center gap-2"
                                            >
                                                {copyStatusCode}
                                            </button>
                                        </div>
                                    </div>
                                    
                                    {/* 輸入伴侶配對碼區塊 */}
                                    <div className="bg-gradient-to-br from-[#FFF5F3] to-[#FCEAE6] rounded-2xl p-6 md:p-8 relative">
                                        <div className="flex items-center gap-3 mb-2">
                                            <i className="fa-solid fa-user-group text-[#C27376]"></i>
                                            <h3 className="font-bold text-textMain text-base md:text-lg">已經拿到伴侶的配對碼？</h3>
                                        </div>
                                        <p className="text-sm text-textMuted mb-5">輸入對方傳來的 8 碼，就能查看你們的合拍結果。</p>
                                        
                                        <div className="relative mt-2">
                                            <div className="absolute -top-2.5 left-4 px-2 bg-[#FFF5F3] text-[#A89D9A] text-[11px] font-bold z-10">伴侶的配對碼</div>
                                            <div className="flex flex-col sm:flex-row gap-3">
                                                <div className="relative flex-1">
                                                    <i className="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-borderDashed"></i>
                                                    <input 
                                                        type="text" 
                                                        value={partnerCodeInput}
                                                        onChange={(e) => setPartnerCodeInput(e.target.value.toUpperCase())}
                                                        maxLength={8}
                                                        placeholder="例如 7K3M9WQP"
                                                        className="w-full pl-11 pr-4 py-3.5 rounded-xl border border-borderSoft focus:outline-none focus:border-primary bg-white font-mono font-bold text-[#6D4C53] tracking-widest placeholder:font-sans placeholder:tracking-normal placeholder:font-normal placeholder:text-gray-300 transition-colors"
                                                    />
                                                </div>
                                                <button 
                                                    onClick={handleCompare}
                                                    disabled={isCheckingPartner || partnerCodeInput.length !== 8}
                                                    className="disabled:opacity-50 disabled:cursor-not-allowed bg-gradient-to-r from-primary to-secondary text-white rounded-xl px-8 py-3.5 text-sm font-bold shadow-sm hover:shadow-md transition flex items-center justify-center gap-2 whitespace-nowrap"
                                                >
                                                    {isCheckingPartner ? '比對中...' : '立即比對'} <i className="fa-solid fa-arrow-right"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <p className="text-[11px] text-[#A89D9A] mt-3">配對碼不分大小寫</p>
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-cardBg rounded-[2rem] shadow-sm border border-[#E28565] p-8 md:p-10 relative mt-10 text-center animate-fade-in">
                                    <div className="absolute -top-6 left-1/2 -translate-x-1/2 w-12 h-12 rounded-full bg-[#FFF5F3] flex items-center justify-center text-secondary text-xl border border-white shadow-sm">
                                        <i className="fa-solid fa-check-double"></i>
                                    </div>
                                    <h2 className="text-2xl font-bold text-textMain mt-4 mb-2">配對比對完成</h2>
                                    <p className="text-textMuted text-sm">你們的雙人合拍度已合併顯示於上方圖譜中！</p>
                                </div>
                            )}
                            {/* --- 配對碼區塊結束 --- */}

                            {/* 家庭安心陪伴計畫 (維持暖色風格) */}
                            <div className="bg-cardBg rounded-[2rem] shadow-sm overflow-hidden border border-borderSoft mt-6">
                                <div className="bg-[#FFF5F3] px-8 py-4 flex items-center justify-between border-b border-borderSoft">
                                    <div className="flex items-center gap-2">
                                        <i className="fa-solid fa-leaf text-primary"></i>
                                        <span className="font-serif font-bold text-textMain text-sm md:text-base">家庭安心陪伴計畫</span>
                                    </div>
                                    <span className="text-[10px] text-primary bg-white px-3 py-1 rounded-full font-bold border border-borderSoft">專屬推薦</span>
                                </div>
                                <div className="p-8 md:flex gap-8 items-center bg-white">
                                    <div className="w-16 h-16 rounded-full flex flex-shrink-0 items-center justify-center text-2xl mx-auto md:mx-0 mb-6 md:mb-0 bg-[#FCF8F7] text-textMain">
                                        <i className={`fa-solid ${trustRec.icon}`}></i>
                                    </div>
                                    <div className="flex-grow text-center md:text-left">
                                        <div className="inline-block px-3 py-1 bg-bgBase text-textMuted text-[10px] font-bold rounded-full mb-2">
                                            {trustRec.subtitle}
                                        </div>
                                        <h3 className="font-serif text-lg font-bold text-textMain mb-2">{trustRec.title}</h3>
                                        <p className="text-textMuted text-xs leading-relaxed mb-4">{trustRec.desc}</p>
                                        <div className="flex flex-wrap gap-2 justify-center md:justify-start">
                                            {trustRec.features.map((feat, idx) => (
                                                <span key={idx} className="px-3 py-1.5 bg-bgBase text-textMain text-[10px] font-bold rounded-lg flex items-center gap-1 border border-[#ECE3E0]">
                                                    <i className="fa-solid fa-check text-primary text-[10px]"></i> {feat}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* --- 新增：免費預約諮詢區塊 --- */}
                            <div className="bg-cardBg rounded-[2rem] shadow-sm overflow-hidden border border-borderSoft mt-6 mb-12 relative">
                                <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-primary to-secondary"></div>
                                <div className="bg-gradient-to-br from-[#FFF5F3] to-[#FCEAE6] px-8 py-6 border-b border-borderSoft">
                                    <div className="flex items-center gap-3 mb-2">
                                        <div className="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-secondary">
                                            <i className="fa-solid fa-headset text-lg"></i>
                                        </div>
                                        <h3 className="font-serif font-bold text-textMain text-xl">免費諮詢</h3>
                                    </div>
                                    <p className="text-textMuted text-sm pl-13">財務諮詢不只是談錢，而是陪你把狀況整理清楚。先從現在最困擾的事情開始。</p>
                                </div>
                                <div className="p-8 md:p-10 bg-white">
                                    {isConsultSubmitted ? (
                                        <div className="text-center py-6 fade-in">
                                            <div className="w-16 h-16 rounded-full bg-[#FCF8F7] text-primary border border-borderSoft flex items-center justify-center text-2xl mx-auto mb-4">
                                                <i className="fa-solid fa-check"></i>
                                            </div>
                                            <h4 className="font-bold text-textMain text-lg mb-2">已收到您的申請</h4>
                                            <p className="text-textMuted text-sm">我們將於約 10 個工作天內由財務健康管理師與您聯繫，請留意信箱。</p>
                                        </div>
                                    ) : (
                                        <form onSubmit={submitConsultation} className="space-y-5 max-w-lg mx-auto">
                                            <div>
                                                <label className="block text-sm font-bold text-textMain mb-2">暱稱</label>
                                                <input
                                                    type="text"
                                                    required
                                                    value={consultData.nickname}
                                                    onChange={e => setConsultData({...consultData, nickname: e.target.value})}
                                                    className="w-full px-5 py-3.5 rounded-xl border border-borderSoft focus:outline-none focus:border-primary focus:ring-2 focus:ring-primaryLight bg-[#FCF9F6] transition-all text-textMain"
                                                    placeholder="怎麼稱呼您？"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-textMain mb-2">Email</label>
                                                <input
                                                    type="email"
                                                    required
                                                    value={consultData.email}
                                                    onChange={e => setConsultData({...consultData, email: e.target.value})}
                                                    className="w-full px-5 py-3.5 rounded-xl border border-borderSoft focus:outline-none focus:border-primary focus:ring-2 focus:ring-primaryLight bg-[#FCF9F6] transition-all text-textMain"
                                                    placeholder="您的電子信箱"
                                                />
                                            </div>
                                            
                                            <div className="pt-2">
                                                <button
                                                    type="submit"
                                                    className="w-full bg-gradient-to-r from-primary to-secondary text-white rounded-xl px-6 py-4 text-sm font-bold shadow-button hover:shadow-lg hover:-translate-y-0.5 transition-all flex justify-center items-center gap-2"
                                                >
                                                    送出預約申請 <i className="fa-solid fa-paper-plane"></i>
                                                </button>
                                                <p className="text-center text-[11px] text-[#A89D9A] mt-3 font-medium">送出後約 10 個工作天內由財務健康管理師回覆</p>
                                            </div>
                                        </form>
                                    )}
                                </div>
                            </div>
                            {/* --- 免費諮詢區塊結束 --- */}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen">
                    {step === 'landing' && renderLanding()}
                    {step === 'assessment' && renderAssessment()}
                    {step === 'lifestage' && renderLifeStage()}
                    {step === 'loading' && renderLoading()}
                    {step === 'result' && renderResult()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
